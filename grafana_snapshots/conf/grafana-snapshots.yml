general:
  logger:
    # full file path or 'syslog' or stdout
    facility: stdout
    logLevel: verbose
  snapshot_suffix: "_%Y%m%d%H%M"
  output_path: snapshots
  default_dashboard: Oracle Overview
  # grafana bug #98448 - dashboard uid MUST exist into grafana server to import snapshots.
  # if grafana version is greater equal than 11.0, will check that this dashboard uid exists in grafana server, if not, will create a new dashboard with this uid.
  default_dashboard_uid: "____DEFAULT_UID_SNAPSHOTS____"
  default_dashboard_title: "_DEFAULT_DASHBOARD_FOR_SNAPSHOTS_"
  default_dashboard_folder: "Draft"
grafana:
  default:
    protocol: http
    host: localhost
    port: 3000
    token: "____APIKEY____"
    search_api_limit: 5000
    verify_ssl: true

contexts:
  # set default elements for dashboards
  "Oracle Overview":
    time_from: "now-2d"
    time_to: "now"
    # required with Oracle Overview
    vars:
      dbhost: "host.domain"
      dbinstance: "MYDB.DOM.ORG"
  # ****
  "Network Usage":
    time_from: "now-10m"
    time_to: "now"
    vars:
      device: "host-1"
      # interface": ".*"

